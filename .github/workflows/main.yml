name: Manual Hub Rebuild

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests yt-dlp

      - name: Rebuild Hub from current video library
        run: |
          mkdir -p site_output
          python autopilot_generator.py

      - name: Save generator state if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add drip_state.json videos_library.json
          git diff --staged --quiet || git commit -m "Manual Hub rebuild state update [skip ci]"
          git push

      - name: Deploy website to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site_output
